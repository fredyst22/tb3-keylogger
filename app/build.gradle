buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.4.2"
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.mimalware.keyloggerv2"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 2
        versionName "2.0"
    }
}

repositories {
    google()
    mavenCentral()
}
